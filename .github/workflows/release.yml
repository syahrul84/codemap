# Builds codemap for macOS, Linux and Windows and publishes a GitHub release when a
# version tag (v0.1.0, …) is pushed. The tag must match the workspace version
# in Cargo.toml.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Release builds report the plain version (others add -dev+<commit>).
  CODEMAP_RELEASE: "1"
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1; }
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
      - run: cargo build --release --locked -p codemap-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          dir=target/${{ matrix.target }}/release
          if [ "$RUNNER_OS" = Windows ]; then
            "$dir/codemap.exe" --version
            # A smoke test of the Windows program on a real project.
            "$dir/codemap.exe" --data-dir "$RUNNER_TEMP/cm" scan --project fixtures/laravel11-slim
            "$dir/codemap.exe" --data-dir "$RUNNER_TEMP/cm" query --project fixtures/laravel11-slim search_symbol '{"query":"Order"}'
            (cd "$dir" && 7z a -tzip "$GITHUB_WORKSPACE/codemap-${{ matrix.target }}.zip" codemap.exe)
            # `codemap update` unpacks it with Windows' own tar.exe: check it can.
            mkdir -p "$RUNNER_TEMP/unzip"
            /c/Windows/System32/tar.exe -xf "codemap-${{ matrix.target }}.zip" -C "$RUNNER_TEMP/unzip"
            "$RUNNER_TEMP/unzip/codemap.exe" --version
          else
            "$dir/codemap" --version || true   # cross-built x86_64 macOS runs under Rosetta when installed
            tar czf codemap-${{ matrix.target }}.tar.gz -C "$dir" codemap
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: codemap-${{ matrix.target }}
          path: codemap-${{ matrix.target }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist && sha256sum codemap-*.tar.gz codemap-*.zip > SHA256SUMS && cd ..
          # The section of CHANGELOG.md for this version.
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { on = index($0, "[" v "]") > 0; next }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "codemap $GITHUB_REF_NAME" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "codemap $GITHUB_REF_NAME" --notes-file notes.md
