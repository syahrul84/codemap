[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
repository = "https://github.com/syahrul84/codemap"

[workspace.dependencies]
# Internal crates
codemap-core = { path = "crates/codemap-core" }
codemap-php = { path = "crates/codemap-php" }
codemap-laravel = { path = "crates/codemap-laravel" }
codemap-mcp = { path = "crates/codemap-mcp" }
codemap-js = { path = "crates/codemap-js" }
codemap-vue = { path = "crates/codemap-vue" }

# Pinned once here; each crate opts in when its phase needs it.
anyhow = "=1.0.104"
blake3 = "=1.8.7"
clap = { version = "=4.6.7", features = ["derive", "env"] }
dirs = "=7.0.0"
filetime = "=0.2.29"
ignore = "=0.4.33"
jiff = "=0.2.38"
oxc_allocator = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_ast_visit = "=0.154.0"
oxc_parser = "=0.154.0"
oxc_span = "=0.154.0"
insta = { version = "=1.49.0", features = ["json"] }
rayon = "=1.12.0"
rmcp = { version = "=3.5.1", default-features = false }
rusqlite = { version = "=0.40.2", features = ["bundled", "fallible_uint"] }
# Read-only checks of a real database's `migrations` table (off unless configured).
postgres = "=0.19.14"
mysql = { version = "=28.0.3", default-features = false, features = ["minimal-rust"] }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
# Checks downloaded releases (`codemap update`).
sha2 = "=0.10.9"
strsim = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", default-features = false }
toml = "=1.1.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
tree-sitter = "=0.27.1"
tree-sitter-php = "=0.25.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
