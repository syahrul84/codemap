services:
  # Rust toolchain. Source is bind-mounted; registry and target/ live in named
  # volumes because bind-mounted target/ is very slow on macOS.
  dev:
    build:
      context: .
      target: dev
    image: codemap-dev:latest
    working_dir: /src
    volumes:
      - .:/src
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/target
    environment:
      CARGO_TARGET_DIR: /target
      CARGO_TERM_COLOR: always

  # Runtime image for manual testing: PROJECT=/path/to/laravel docker compose run --rm codemap scan --project /workspace
  # stdin_open without tty: a TTY would corrupt the MCP stdio stream.
  codemap:
    build:
      context: .
      target: runtime
    image: codemap:latest
    stdin_open: true
    tty: false
    volumes:
      - ${PROJECT:-./fixtures}:/workspace:ro
      - codemap-data:/data

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
  codemap-data:
