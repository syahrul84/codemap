[package]
name = "pidx-cli"
description = "The pidx command-line tool and MCP server entry point"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pidx"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
pidx-core.workspace = true
pidx-laravel.workspace = true
pidx-mcp.workspace = true
pidx-vue.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time"] }

[lints]
workspace = true
