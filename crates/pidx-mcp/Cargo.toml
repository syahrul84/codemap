[package]
name = "pidx-mcp"
description = "MCP stdio server exposing the pidx index as tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
pidx-core.workspace = true
pidx-js.workspace = true
pidx-laravel.workspace = true
pidx-php.workspace = true
pidx-vue.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
strsim.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "time", "sync"] }
tracing.workspace = true
tree-sitter.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "time"] }

[lints]
workspace = true
